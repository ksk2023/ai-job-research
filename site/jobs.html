<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 岗位列表 - 秋招实习筛选</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand"><span class="logo">AI</span> 岗位调研</div>
  <div class="navbar-nav">
    <a href="index.html">数据看板</a>
    <a href="jobs.html" class="active">岗位列表</a>
    <a href="company.html">公司维度</a>
    <a href="download.html">数据下载</a>
  </div>
  <div class="navbar-meta" id="resultCount">加载中...</div>
</nav>

<div class="container">
  <!-- 筛选器 -->
  <div class="filters">
    <div class="filter-group">
      <label>搜索</label>
      <input type="text" id="searchInput" placeholder="岗位名 / 公司 / 技能关键词">
    </div>
    <div class="filter-group">
      <label>公司</label>
      <select id="filterCompany"><option value="">全部</option></select>
    </div>
    <div class="filter-group">
      <label>类别</label>
      <select id="filterCategory">
        <option value="">全部</option>
        <option value="tech">技术岗</option>
        <option value="non_tech">非技术岗</option>
      </select>
    </div>
    <div class="filter-group">
      <label>类型</label>
      <select id="filterJobType">
        <option value="">全部</option>
        <option value="autumn_campus">秋招</option>
        <option value="intern">实习</option>
        <option value="social">社招</option>
      </select>
    </div>
    <div class="filter-group">
      <label>地点</label>
      <select id="filterLocation"><option value="">全部</option></select>
    </div>
    <div class="filter-group">
      <label>AI相关度</label>
      <select id="filterAiRelevance">
        <option value="">全部</option>
        <option value="core">核心AI</option>
        <option value="high">高度相关</option>
        <option value="medium">中等相关</option>
        <option value="low">低相关</option>
      </select>
    </div>
    <div class="filter-group">
      <label>验证</label>
      <select id="filterVerification">
        <option value="">全部</option>
        <option value="verified">已验证</option>
        <option value="single_source">待核实</option>
      </select>
    </div>
  </div>

  <!-- 岗位表格 -->
  <div id="jobsTableContainer">
    <div class="loading"><div class="spinner"></div><div style="margin-top:12px;">加载岗位数据...</div></div>
  </div>

  <!-- 分页 -->
  <div class="pagination" id="pagination"></div>
</div>

<div class="footer">AI 岗位调研 · 数据仅供参考 · 多源交叉验证</div>

<script src="assets/vendor/echarts.min.js"></script>
<script>
let allJobs = [];
let filteredJobs = [];
let currentPage = 1;
const PAGE_SIZE = 20;

const CATEGORY_NAMES = { tech: '技术岗', non_tech: '非技术岗' };
const JOB_TYPE_NAMES = { autumn_campus: '秋招', intern: '实习', social: '社招' };
const AI_RELEVANCE_NAMES = { core: '核心AI', high: '高度相关', medium: '中等', low: '低相关' };

async function loadJobs() {
  try {
    const resp = await fetch('data/jobs.json');
    allJobs = await resp.json();
    initFilters();
    applyFilters();
  } catch (e) {
    console.error(e);
    document.getElementById('jobsTableContainer').innerHTML = '<div class="empty-state"><div class="icon">!</div>数据加载失败</div>';
  }
}

function initFilters() {
  const companies = [...new Set(allJobs.map(j => j.company).filter(Boolean))].sort();
  const companySelect = document.getElementById('filterCompany');
  companies.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    companySelect.appendChild(opt);
  });

  const locations = [...new Set(allJobs.flatMap(j => j.location || []))].sort();
  const locSelect = document.getElementById('filterLocation');
  locations.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l;
    opt.textContent = l;
    locSelect.appendChild(opt);
  });
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const company = document.getElementById('filterCompany').value;
  const category = document.getElementById('filterCategory').value;
  const jobType = document.getElementById('filterJobType').value;
  const location = document.getElementById('filterLocation').value;
  const aiRel = document.getElementById('filterAiRelevance').value;
  const verification = document.getElementById('filterVerification').value;

  filteredJobs = allJobs.filter(j => {
    if (search) {
      const text = `${j.title || ''} ${j.company || ''} ${(j.skills || []).join(' ')} ${j.responsibilities || ''}`.toLowerCase();
      if (!text.includes(search)) return false;
    }
    if (company && j.company !== company) return false;
    if (category && j.category !== category) return false;
    if (jobType && j.job_type !== jobType) return false;
    if (location && !(j.location || []).includes(location)) return false;
    if (aiRel && j.ai_relevance !== aiRel) return false;
    if (verification && j.verification_status !== verification) return false;
    return true;
  });

  currentPage = 1;
  renderTable();
  renderPagination();
  document.getElementById('resultCount').textContent = `共 ${filteredJobs.length} 条岗位`;
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageJobs = filteredJobs.slice(start, start + PAGE_SIZE);

  if (pageJobs.length === 0) {
    document.getElementById('jobsTableContainer').innerHTML = '<div class="empty-state"><div class="icon">!</div>没有匹配的岗位</div>';
    return;
  }

  const html = `
    <table class="jobs-table">
      <thead>
        <tr>
          <th>岗位名称</th>
          <th>公司</th>
          <th>类别</th>
          <th>类型</th>
          <th>地点</th>
          <th>AI相关度</th>
          <th>验证</th>
          <th>置信度</th>
        </tr>
      </thead>
      <tbody>
        ${pageJobs.map(j => `
          <tr style="cursor:pointer" onclick="location.href='detail.html?id=${encodeURIComponent(j.id)}'">
            <td><a href="detail.html?id=${encodeURIComponent(j.id)}">${escapeHtml(j.title || '未命名')}</a></td>
            <td>${escapeHtml(j.company || '-')}</td>
            <td>${categoryBadge(j.category)}</td>
            <td>${jobTypeBadge(j.job_type)}</td>
            <td>${(j.location || []).join(' / ') || '-'}</td>
            <td>${aiRelevanceBadge(j.ai_relevance)}</td>
            <td>${verificationBadge(j.verification_status)}</td>
            <td>
              <div style="display:flex;align-items:center;gap:6px;">
                <div class="confidence-bar" style="flex:1;max-width:60px;">
                  <div class="confidence-bar-fill" style="width:${j.confidence_score||0}%;background:${confidenceColor(j.confidence_score)}"></div>
                </div>
                <span style="font-size:12px;color:var(--text-tertiary);">${j.confidence_score||0}</span>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  document.getElementById('jobsTableContainer').innerHTML = html;
}

function renderPagination() {
  const totalPages = Math.ceil(filteredJobs.length / PAGE_SIZE);
  if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  let html = '';
  html += `<button ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">上一页</button>`;
  const maxBtns = 7;
  let start = Math.max(1, currentPage - 3);
  let end = Math.min(totalPages, start + maxBtns - 1);
  start = Math.max(1, end - maxBtns + 1);
  if (start > 1) html += `<button onclick="goPage(1)">1</button>`;
  if (start > 2) html += `<span style="padding:0 4px;color:var(--text-tertiary);">...</span>`;
  for (let i = start; i <= end; i++) {
    html += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < totalPages - 1) html += `<span style="padding:0 4px;color:var(--text-tertiary);">...</span>`;
  if (end < totalPages) html += `<button onclick="goPage(${totalPages})">${totalPages}</button>`;
  html += `<button ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">下一页</button>`;
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) { currentPage = p; renderTable(); renderPagination(); window.scrollTo(0, 0); }

function categoryBadge(c) {
  if (c === 'tech') return '<span class="badge badge-tech">技术岗</span>';
  if (c === 'non_tech') return '<span class="badge badge-non-tech">非技术</span>';
  return '<span class="badge badge-low">未分类</span>';
}
function jobTypeBadge(t) {
  if (t === 'autumn_campus') return '<span class="badge badge-autumn">秋招</span>';
  if (t === 'intern') return '<span class="badge badge-intern">实习</span>';
  if (t === 'social') return '<span class="badge badge-low">社招</span>';
  return '-';
}
function aiRelevanceBadge(r) {
  const map = { core: 'badge-core', high: 'badge-high', medium: 'badge-medium', low: 'badge-low' };
  const names = { core: '核心AI', high: '高度', medium: '中等', low: '低' };
  return `<span class="badge ${map[r]||'badge-low'}">${names[r]||'未知'}</span>`;
}
function verificationBadge(s) {
  if (s === 'verified') return '<span class="badge badge-verified">已验证</span>';
  if (s === 'single_source') return '<span class="badge badge-single">待核实</span>';
  return '<span class="badge badge-low">未知</span>';
}
function confidenceColor(score) {
  if (score >= 80) return '#1B9E6B';
  if (score >= 60) return '#4C5FE0';
  if (score >= 40) return '#E88A2A';
  return '#E5484D';
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

// 绑定事件
['searchInput','filterCompany','filterCategory','filterJobType','filterLocation','filterAiRelevance','filterVerification'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
  document.getElementById(id).addEventListener('change', applyFilters);
});

loadJobs();
</script>
</body>
</html>
